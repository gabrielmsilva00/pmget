name: Backend checks

on: [push, pull_request]

jobs:
  backends:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Bash 4+ on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Check Bash syntax and backends
        shell: bash
        run: |
          bash -n pmget
          bash tests/backends.sh
          bash tests/dependencies.sh
      - name: Check interactive dependency prompts
        if: runner.os != 'Windows'
        run: python3 tests/dependency-prompts.py
      - name: Check native Windows launchers
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/windows-launchers.ps1
